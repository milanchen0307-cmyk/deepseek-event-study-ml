var SET={};SETS.forEach(function(x){SET[x.key]=x;});
function setLabel(k){return T('set.'+k);}
function modelName(k){return T('model.'+k);}
function metricName(k){return T('m.'+k);}
function rowLabel(d){return setLabel(d.feature_set)+' · '+modelName(d.model_name);}
D.forEach(function(d,i){d.id=i;});
var state={metric:'roc_auc',order:'group'};

function groupInfo(key){var rows=D.filter(function(d){return d.feature_set===key;});var ns=rows.map(function(r){return r.n_samples;}),nf=rows.map(function(r){return r.n_features;});
  return {rows:rows,n:ns.every(function(v){return v===ns[0];})?ns[0]:ns.join('/'),nf:nf.every(function(v){return v===nf[0];})?nf[0]:nf.join('/')};}
function best(key,metric){return groupInfo(key).rows.reduce(function(a,b){return b[metric+'_mean']>a[metric+'_mean']?b:a;});}
function range(key,metric){var v=groupInfo(key).rows.map(function(r){return r[metric+'_mean'];});return [Math.min.apply(null,v),Math.max.apply(null,v)];}

/* KPI rail follows the selected metric */
function renderKpis(){
  var met=state.metric,host=$('dk-kpis');clear(host);
  var bt=best('X_text_only',met),bc=best('X_fin_plus_X_text',met),fr=range('X_fin_only',met);
  function card(cls,l,v,sub){var d=h('div',{class:'kpi'+(cls?' '+cls:'')},host);h('div',{class:'l'},d,l);h('div',{class:'v'},d,v);h('div',{class:'s'},d,sub);}
  card('hl',T('kpi.text',metricName(met)),f3(bt[met+'_mean']),modelName(bt.model_name)+' · ±'+f3(bt[met+'_std']));
  card('',T('kpi.comb',metricName(met)),f3(bc[met+'_mean']),modelName(bc.model_name)+' · ±'+f3(bc[met+'_std']));
  card('',T('kpi.fin',metricName(met)),f3(fr[0])+'–'+f3(fr[1]),T('kpi.fin.s'));
  card('',T('kpi.n'),groupInfo('X_fin_only').n+' / '+groupInfo('X_text_only').n,T('kpi.n.s'));
}

function renderKey(){
  var host=$('dk-key');clear(host);
  SETS.forEach(function(st){var sp=h('span',null,host);var k=s('svg',{width:14,height:14,viewBox:'-7 -7 14 14'},sp);mark(k,st,5.5);sp.appendChild(document.createTextNode(setLabel(st.key)));});
  var sp=h('span',null,host);var k=s('svg',{width:26,height:14,viewBox:'0 -7 26 14'},sp);
  s('line',{x1:1,x2:25,y1:0,y2:0,stroke:'#1F2933','stroke-width':1.5},k);s('line',{x1:1,x2:1,y1:-4,y2:4,stroke:'#1F2933','stroke-width':1.5},k);s('line',{x1:25,x2:25,y1:-4,y2:4,stroke:'#1F2933','stroke-width':1.5},k);
  sp.appendChild(document.createTextNode(T('key.sd')));
}
function mark(parent,st,r){
  var a={fill:st.color,stroke:st.color,'stroke-width':1.5};
  if(st.shape==='circle'){a.r=r;a.cx=0;a.cy=0;return s('circle',a,parent);}
  if(st.shape==='square'){a.x=-r*.85;a.y=-r*.85;a.width=r*1.7;a.height=r*1.7;return s('rect',a,parent);}
  a.d='M0,'+(-r*1.15)+' L'+(r*1.15)+',0 L0,'+(r*1.15)+' L'+(-r*1.15)+',0 Z';return s('path',a,parent);
}

/* chart */
var svg=$('dk-chart'),C=null;
function layout(){
  var W=Math.max(300,$('dk-chart-host').clientWidth),narrow=W<600;
  var m={l:narrow?104:190,r:narrow?48:112,t:26,b:40},rowH=narrow?25:27,gap=narrow?28:28;
  var H=m.t+D.length*rowH+SETS.length*gap+m.b;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('width',W);svg.setAttribute('height',H);
  var keep=[svg.querySelector('title'),svg.querySelector('desc')];clear(svg);keep.forEach(function(k){svg.appendChild(k);});
  var gGrid=s('g',null,svg),gHead=s('g',null,svg),gRows=s('g',null,svg);
  var heads=SETS.map(function(st){var g=s('g',{class:'mv'},gHead);var g2=groupInfo(st.key);
    s('text',{x:0,y:0,'font-size':narrow?12:13,'font-weight':600,fill:st.color==='#8C99A6'?'#5B6B7B':st.color},g,setLabel(st.key));
    s('text',{x:narrow?0:W-m.r+10,y:narrow?14:0,'font-size':12,fill:'#5B6B7B'},g,T('head.n',g2.n,g2.nf));
    return {st:st,g:g};});
  var rows=D.map(function(d){
    var st=SET[d.feature_set];var g=s('g',{class:'mv'},gRows);
    var lab=s('text',{x:m.l-12,y:5,'text-anchor':'end','font-size':narrow?12:14,fill:'#1F2933'},g,'');
    var tag=s('text',{x:m.l-12,y:5,'text-anchor':'end','font-size':12,fill:'#5B6B7B','font-weight':600,class:'mv'},g,'');
    var wl=s('line',{x1:0,x2:1,y1:0,y2:0,stroke:st.color,'stroke-width':1.6,class:'mv'},g);
    var cL=s('line',{x1:0,x2:0,y1:-5,y2:5,stroke:st.color,'stroke-width':1.6,class:'mv'},g);
    var cR=s('line',{x1:0,x2:0,y1:-5,y2:5,stroke:st.color,'stroke-width':1.6,class:'mv'},g);
    var dg=s('g',{class:'mv'},g);mark(dg,st,narrow?5:6);
    var val=s('text',{x:0,y:5,'font-size':12,fill:'#5B6B7B',class:'mv num'},g);
    return {d:d,st:st,g:g,lab:lab,tag:tag,wl:wl,cL:cL,cR:cR,dg:dg,val:val};
  });
  C={W:W,H:H,m:m,rowH:rowH,gap:gap,narrow:narrow,gGrid:gGrid,heads:heads,rows:rows};
}
function update(){
  var met=state.metric,m=C.m,W=C.W,H=C.H;
  var lo=Math.min.apply(null,D.map(function(d){return d[met+'_mean']-d[met+'_std'];}));
  var hi=Math.max.apply(null,D.map(function(d){return d[met+'_mean']+d[met+'_std'];}));
  var d0=Math.min(0.5,Math.floor(lo*20)/20),d1=Math.min(1,Math.ceil(hi*20)/20);
  var x=function(v){return m.l+(v-d0)/(d1-d0)*(W-m.l-m.r);};
  clear(C.gGrid);
  for(var t=Math.ceil(d0*20-1e-9)/20;t<=d1+1e-9;t+=0.05){
    var tt=Math.round(t*100)/100,major=Math.abs(tt*10-Math.round(tt*10))<1e-6;
    if(!major&&C.narrow)continue;
    s('line',{x1:x(tt),x2:x(tt),y1:m.t-6,y2:H-m.b,stroke:major?'#E3E8EE':'#F1F4F7'},C.gGrid);
    if(major)s('text',{x:x(tt),y:H-m.b+16,'text-anchor':'middle','font-size':12,fill:'#5B6B7B',class:'num'},C.gGrid,tt.toFixed(1));
  }
  s('line',{x1:x(0.5),x2:x(0.5),y1:m.t-10,y2:H-m.b,stroke:'#5B6B7B','stroke-dasharray':'3 3'},C.gGrid);
  s('text',{x:x(0.5)+5,y:m.t-12,'font-size':12,fill:'#5B6B7B'},C.gGrid,T(met==='roc_auc'?'ref.auc':'ref.other'));
  s('text',{x:W-m.r,y:H-6,'text-anchor':'end','font-size':12,'font-weight':600,fill:'#1F2933'},C.gGrid,T('axis',metricName(met)));
  var order=D.slice();
  if(state.order==='mean')order.sort(function(a,b){return b[met+'_mean']-a[met+'_mean'];});
  var ypos={},y=m.t,headY={};
  if(state.order==='group'){
    SETS.forEach(function(st){headY[st.key]=y+12;y+=C.gap;order.filter(function(d){return d.feature_set===st.key;}).forEach(function(d){ypos[d.id]=y+C.rowH/2-4;y+=C.rowH;});});
  }else{
    y+=C.gap*0.5;order.forEach(function(d){ypos[d.id]=y+C.rowH/2;y+=C.rowH;});
  }
  C.heads.forEach(function(hd){
    if(state.order==='group'){hd.g.style.opacity=1;hd.g.style.transform='translate(8px,'+headY[hd.st.key]+'px)';}
    else hd.g.style.opacity=0;
  });
  C.rows.forEach(function(r){
    var mu=r.d[met+'_mean'],sd=r.d[met+'_std'];
    var a=x(Math.max(d0,mu-sd)),b=x(Math.min(d1,mu+sd)),xm=x(mu);
    r.g.style.transform='translate(0px,'+ypos[r.d.id]+'px)';
    r.wl.style.transform='translateX('+a+'px) scaleX('+Math.max(1,b-a)+')';
    r.cL.style.transform='translateX('+a+'px)';r.cR.style.transform='translateX('+b+'px)';
    r.dg.style.transform='translateX('+xm+'px)';
    r.val.textContent=f3(mu)+(C.narrow?'':' ± '+f3(sd));
    r.val.style.transform='translateX('+(b+8)+'px)';
    var mname=C.narrow?T('short.'+r.d.model_name):modelName(r.d.model_name);
    if(state.order==='mean'){
      if(C.narrow){r.tag.style.opacity=0;r.lab.textContent=T('setCode.'+r.st.key)+' · '+mname;}
      else{r.lab.textContent=mname;r.tag.textContent=T('setShort.'+r.st.key);r.tag.style.opacity=1;r.tag.style.transform='translateX(-120px)';}
    }else{r.lab.textContent=mname;r.tag.style.opacity=0;}
  });
  var cap=$('dk-figcap');clear(cap);
  cap.appendChild(document.createTextNode(T('cap',groupInfo('X_fin_only').n,groupInfo('X_text_only').n)));
  h('a',{href:README},cap,T('nav.method'));
  $('dk-chart-desc').textContent=T('desc',metricName(met),D.map(function(d){return [rowLabel(d),f3(d[met+'_mean']),f3(d[met+'_std'])];}));
  renderKpis();
}

function renderTable(){
  var tb=$('dk-table');clear(tb);
  D.forEach(function(d){var tr=h('tr',null,tb);h('td',null,tr,setLabel(d.feature_set));h('td',null,tr,modelName(d.model_name));h('td',null,tr,String(d.n_samples));h('td',null,tr,String(d.n_features));['accuracy','f1','roc_auc'].forEach(function(k){h('td',null,tr,f3(d[k+'_mean'])+' ± '+f3(d[k+'_std']));});});
}

/* language switch re-renders with the current metric and order */
function renderAll(){applyStatic();renderKey();renderTable();layout();update();}
each('[data-lang]',function(b){b.addEventListener('click',function(){
  lang=b.getAttribute('data-lang');
  try{window.localStorage.setItem(LS_KEY,lang);}catch(e){}
  renderAll();
});});
each('input[name="dk-metric"]',function(r){r.addEventListener('change',function(){state.metric=this.value;update();});});
each('input[name="dk-order"]',function(r){r.addEventListener('change',function(){state.order=this.value;update();});});
renderAll();
var rt=null,lw=$('dk-chart-host').clientWidth;
window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){var w=$('dk-chart-host').clientWidth;if(w!==lw){lw=w;layout();update();}},120);});
})();
</script>
</body>
</html>
